services:
  # Frontend service
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - GIN_MODE=release
      - PORT=3000
      - API_URL=http://api:8080
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - household-network

  # API service (reference to API project)
  api:
    build: ../household-App-API
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - PORT=8080
      - TZ=Asia/Tokyo
    volumes:
      - api-data:/app/data
    restart: unless-stopped
    networks:
      - household-network

  # Development frontend with hot reload
  frontend-dev:
    image: golang:1.21-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - GIN_MODE=debug
      - PORT=3000
      - API_URL=http://api-dev:8080
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
    command: go run .
    depends_on:
      - api-dev
    profiles:
      - dev
    networks:
      - household-network

  # Development API
  api-dev:
    image: golang:1.21-alpine
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=debug
      - PORT=8080
      - TZ=Asia/Tokyo
    volumes:
      - ../household-App-API:/app
      - go-mod-cache:/go/pkg/mod
      - api-data:/app/data
    command: sh -c "apk add --no-cache gcc musl-dev && go run ."
    profiles:
      - dev
    networks:
      - household-network

volumes:
  api-data:
  go-mod-cache:

networks:
  household-network:
    driver: bridge
