<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家計簿アプリ</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body x-data="app()" x-init="init()">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-wallet2 me-2"></i>家計簿
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" :class="{ 'active': currentPage === 'dashboard' }"
                           href="#" @click.prevent="navigate('dashboard')">
                            <i class="bi bi-graph-up me-1"></i>ダッシュボード
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" :class="{ 'active': currentPage === 'transactions' }"
                           href="#" @click.prevent="navigate('transactions')">
                            <i class="bi bi-list-ul me-1"></i>収支一覧
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" :class="{ 'active': currentPage === 'categories' }"
                           href="#" @click.prevent="navigate('categories')">
                            <i class="bi bi-tags me-1"></i>カテゴリ
                        </a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-light" @click="showAddTransaction()">
                        <i class="bi bi-plus-lg me-1"></i>新規登録
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-4">
        <!-- Dashboard Page -->
        <div x-show="currentPage === 'dashboard'" x-cloak>
            <div hx-get="/pages/dashboard" hx-trigger="load" hx-swap="innerHTML">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Transactions Page -->
        <div x-show="currentPage === 'transactions'" x-cloak>
            <div id="transactions-page"
                 hx-get="/pages/transactions"
                 hx-trigger="load, transactionsUpdated from:body"
                 hx-swap="innerHTML">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Categories Page -->
        <div x-show="currentPage === 'categories'" x-cloak>
            <div id="categories-page"
                 hx-get="/pages/categories"
                 hx-trigger="load, categoriesUpdated from:body"
                 hx-swap="innerHTML">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Transaction Modal -->
    <div class="modal fade" id="transactionModal" tabindex="-1" x-ref="transactionModal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" x-text="editingTransaction ? '収支を編集' : '新規登録'"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form @submit.prevent="saveTransaction()">
                    <div class="modal-body">
                        <!-- Type Selection -->
                        <div class="mb-3">
                            <label class="form-label">種別</label>
                            <div class="btn-group w-100" role="group">
                                <input type="radio" class="btn-check" name="type" id="type-expense"
                                       value="expense" x-model="transactionForm.type">
                                <label class="btn btn-outline-danger" for="type-expense">
                                    <i class="bi bi-dash-circle me-1"></i>支出
                                </label>
                                <input type="radio" class="btn-check" name="type" id="type-income"
                                       value="income" x-model="transactionForm.type">
                                <label class="btn btn-outline-success" for="type-income">
                                    <i class="bi bi-plus-circle me-1"></i>収入
                                </label>
                            </div>
                        </div>

                        <!-- Category -->
                        <div class="mb-3">
                            <label class="form-label">カテゴリ</label>
                            <select class="form-select" x-model="transactionForm.category_id" required>
                                <option value="">選択してください</option>
                                <template x-for="cat in filteredCategories" :key="cat.id">
                                    <option :value="cat.id" x-text="cat.name"></option>
                                </template>
                            </select>
                        </div>

                        <!-- Amount -->
                        <div class="mb-3">
                            <label class="form-label">金額</label>
                            <div class="input-group">
                                <span class="input-group-text">¥</span>
                                <input type="number" class="form-control"
                                       x-model.number="transactionForm.amount"
                                       min="1" required placeholder="0">
                            </div>
                        </div>

                        <!-- Date -->
                        <div class="mb-3">
                            <label class="form-label">日付</label>
                            <input type="date" class="form-control"
                                   x-model="transactionForm.date" required>
                        </div>

                        <!-- Memo -->
                        <div class="mb-3">
                            <label class="form-label">メモ</label>
                            <textarea class="form-control" rows="2"
                                      x-model="transactionForm.memo"
                                      placeholder="任意"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                        <button type="submit" class="btn btn-primary" :disabled="saving">
                            <span x-show="saving" class="spinner-border spinner-border-sm me-1"></span>
                            <span x-text="editingTransaction ? '更新' : '登録'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">削除確認</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>この記録を削除しますか？</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <button type="button" class="btn btn-danger" @click="confirmDelete()">削除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi me-2" :class="toastIcon"></i>
                <strong class="me-auto" x-text="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" x-text="toastMessage"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!-- Custom JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
